<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إيجارات العمارة - لوحة التحكم</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-color: #333; --border-color: #dddddd; --header-bg: #34495e; }
        body.dark-mode { --bg-color: #1a1a2e; --card-bg: #16213e; --text-color: #e0e0e0; --border-color: #2a2a40; --header-bg: #0f3460; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); }
        .container { max-width: 1300px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 20px; }
        .top-controls { display: flex; gap: 10px; align-items: center; }
        .btn-theme { background: #0f3460; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-news-toggle { background: #e67e22; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-new-month { background: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 5px solid #3498db; }
        .stat-card.green { border-right-color: #2ecc71; }
        .stat-title { font-size: 13px; opacity: 0.8; }
        .stat-value { font-size: 20px; font-weight: bold; margin-top: 5px; }
        .month-section { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .month-title { font-size: 18px; font-weight: bold; color: #3498db; margin: 0; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: var(--header-bg); color: white; white-space: nowrap; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: white; display: inline-block; }
        .bg-paid { background-color: #2ecc71; }
        .bg-pending { background-color: #e74c3c; }
        .btn-pay { background: #2ecc71; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-reset { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-print { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="tel"] { padding: 5px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); border-radius: 4px; }
        input[type="number"] { width: 100px; font-weight: bold; }
        input[type="tel"] { width: 110px; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: var(--card-bg); margin: 5% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
        .close-btn { float: left; font-size: 20px; font-weight: bold; cursor: pointer; }
        .add-news-box { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 15px; }
        .add-news-box input { flex: 1; padding: 8px; font-size: 13px; }
        .btn-add-news { background: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .news-list { list-style: none; padding: 0; margin: 0; }
        .news-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .news-content { flex: 1; padding-left: 10px; }
        .news-time { color: #888; font-size: 11px; }
        .btn-delete-news { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .sync-status { font-size: 12px; color: #2ecc71; font-weight: bold; margin-left: 10px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h1>نظام إيجارات العمارة (مدير) <span class="sync-status" id="syncStatus">🟢 متصل بالسحابة</span></h1>
        </div>
        <div class="top-controls">
            <button class="btn-theme" onclick="toggleDarkMode()">🌙 / ☀️</button>
            <button class="btn-news-toggle" onclick="toggleNewsModal()">📢 الأخبار والتحديثات</button>
            <button class="btn-new-month" onclick="startNewMonth()">🔄 بدء شهر جديد</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">تحصيل الشهر الحالي</div>
            <div class="stat-value" id="currentMonthTotal">0 ج.م</div>
        </div>
        <div class="stat-card green">
            <div class="stat-title">إجمالي التحصيل العام (جميع الشهور)</div>
            <div class="stat-value" id="grandTotal">0 ج.م</div>
        </div>
    </div>

    <div id="monthsContainer">تجري المزامنة وجلب البيانات من السحابة...</div>
</div>

<div id="newsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleNewsModal()">&times;</span>
        <h3>📢 إدارة الأخبار والتحديثات</h3>
        <div class="add-news-box">
            <input type="text" id="customNewsInput" placeholder="اكتب خبراً أو تنبيهاً جديداً..." onkeypress="handleNewsKeyPress(event)">
            <button class="btn-add-news" onclick="addCustomNews()">نشر</button>
        </div>
        <ul class="news-list" id="newsFeed"></ul>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBg5LRqLawCX-m5MqrhRBfopp10CsMRYhk",
        authDomain: "building-rents.firebaseapp.com",
        databaseURL: "https://building-rents-default-rtdb.firebaseio.com",
        projectId: "building-rents",
        storageBucket: "building-rents.firebasestorage.app",
        messagingSenderId: "794361961231",
        appId: "1:794361961231:web:22988bc66e871f1b917c7a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const initialUnits = [];
    for (let floor = 1; floor <= 6; floor++) {
        for (let apt = 1; apt <= 3; apt++) {
            const aptNum = (floor * 100) + apt;
            initialUnits.push({ id: `apt_${aptNum}`, name: `شقة ${aptNum}`, type: `الدور ${floor}`, tenant: `ساكن ${aptNum}`, phone: '', paidAmount: 0, isPaid: false });
        }
    }
    for (let shop = 1; shop <= 4; shop++) {
        initialUnits.push({ id: `shop_${shop}`, name: `محل ${shop}`, type: `الأرضي`, tenant: `مستأجر محل ${shop}`, phone: '', paidAmount: 0, isPaid: false });
    }

    let historyData = [ { monthName: '9 / 2026', units: initialUnits } ];
    let news = [];
    let isDarkMode = localStorage.getItem('building_theme') === 'dark';

    if (isDarkMode) document.body.classList.add('dark-mode');

    db.ref('rents_data').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            if (val.historyData) historyData = val.historyData;
            if (val.news) news = val.news;
            render();
        } else {
            saveDataToCloud();
        }
    });

    function saveDataToCloud() {
        db.ref('rents_data').set({
            historyData: historyData,
            news: news
        });
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('building_theme', isDarkMode ? 'dark' : 'light');
    }

    function toggleNewsModal() {
        const modal = document.getElementById('newsModal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function calculateUnitTotals(unitId) {
        let grandPaid = 0;
        historyData.forEach(m => {
            const u = m.units.find(x => x.id === unitId);
            if (u && u.isPaid) grandPaid += Number(u.paidAmount) || 0;
        });
        return { grandPaid };
    }

    function addCustomNews() {
        const input = document.getElementById('customNewsInput');
        const text = input.value.trim();
        if (!text) return;
        const now = new Date().toLocaleString('ar-EG', { hour: 'numeric', minute: 'numeric', day: 'numeric', month: 'numeric' });
        if (!news) news = [];
        news.push({ text: text, time: now });
        input.value = '';
        saveDataToCloud();
    }

    function handleNewsKeyPress(e) {
        if (e.key === 'Enter') addCustomNews();
    }

    function deleteNews(indexInOriginalArray) {
        if (confirm('هل أنت تأكد من حذف هذا الخبر؟')) {
            news.splice(indexInOriginalArray, 1);
            saveDataToCloud();
        }
    }

    function renderNews() {
        const newsList = document.getElementById('newsFeed');
        if (!news || news.length === 0) {
            newsList.innerHTML = '<li class="news-item">لا توجد تحديثات حالياً.</li>';
            return;
        }
        let html = '';
        for (let i = news.length - 1; i >= 0; i--) {
            const item = news[i];
            html += `
                <li class="news-item">
                    <div class="news-content">
                        <span class="news-time">[${item.time}]</span><br>
                        ${item.text}
                    </div>
                    <button class="btn-delete-news" onclick="deleteNews(${i})">حذف</button>
                </li>
            `;
        }
        newsList.innerHTML = html;
    }

    function render() {
        const container = document.getElementById('monthsContainer');
        container.innerHTML = '';
        let grandTotal = 0;

        historyData.forEach((monthObj, mIndex) => {
            let monthTotal = 0;

            monthObj.units.forEach(u => {
                if (u.isPaid) {
                    const paidVal = Number(u.paidAmount) || 0;
                    monthTotal += paidVal;
                    grandTotal += paidVal;
                }
            });

            if (mIndex === 0) {
                document.getElementById('currentMonthTotal').innerText = monthTotal.toLocaleString() + ' ج.م';
            }

            const section = document.createElement('div');
            section.className = 'month-section';

            section.innerHTML = `
                <div class="month-header">
                    <h2 class="month-title">📅 شهر: ${monthObj.monthName} ${mIndex === 0 ? '(الحالي)' : '(سابق)'}</h2>
                    <div>
                        <b>تحصيل الشهر: ${monthTotal.toLocaleString()} ج.م</b> &nbsp;|&nbsp; 
                        <button class="btn-print" onclick="printMonth(${mIndex})">🖨️ طباعة PDF</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>الوحدة</th>
                                <th>اسم المستأجر</th>
                                <th>رقم الهاتف</th>
                                <th>المبلغ المدفوع الشهر دا</th>
                                <th>الحالة</th>
                                <th>المبلغ المدفوع عامة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${monthObj.units.map((u, uIndex) => {
                                const overall = calculateUnitTotals(u.id);
                                return `
                                <tr>
                                    <td><b>${u.name}</b> <br><small>${u.type}</small></td>
                                    <td>
                                        <input type="text" value="${u.tenant}" onchange="updateTenant(${mIndex}, ${uIndex}, this.value)">
                                    </td>
                                    <td>
                                        <input type="tel" value="${u.phone || ''}" placeholder="01xxxxxxxxx" onchange="updatePhone(${mIndex}, ${uIndex}, this.value)">
                                    </td>
                                    <td>
                                        <input type="number" value="${u.paidAmount}" min="0" onchange="updatePaidAmount(${mIndex}, ${uIndex}, this.value)">
                                    </td>
                                    <td><span class="badge ${u.isPaid ? 'bg-paid' : 'bg-pending'}">${u.isPaid ? 'تم الدفع' : 'معلق'}</span></td>
                                    <td><b style="color: #2ecc71;">${overall.grandPaid.toLocaleString()} ج.م</b></td>
                                    <td>
                                        <button class="${u.isPaid ? 'btn-reset' : 'btn-pay'}" onclick="togglePayment(${mIndex}, ${uIndex})">
                                            ${u.isPaid ? 'إلغاء' : 'تم الدفع'}
                                        </button>
                                    </td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(section);
        });

        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + ' ج.م';
        renderNews();
    }

    function togglePayment(mIndex, uIndex) {
        const unit = historyData[mIndex].units[uIndex];
        const now = new Date().toLocaleString('ar-EG', { hour: 'numeric', minute: 'numeric', day: 'numeric', month: 'numeric' });

        unit.isPaid = !unit.isPaid;
        if (!news) news = [];
        news.push({
            text: unit.isPaid ? 
                `تم سداد إيجار لـ <b>${unit.name}</b> بمبلغ (${unit.paidAmount} ج.م) عن شهر ${historyData[mIndex].monthName}` : 
                `تم إلغاء سداد <b>${unit.name}</b> عن شهر ${historyData[mIndex].monthName}`,
            time: now
        });

        saveDataToCloud();
    }

    function startNewMonth() {
        const nextMonthName = prompt("أدخل اسم الشهر الجديد (مثال: 10 / 2026):");
        if (!nextMonthName) return;

        const newUnits = historyData[0].units.map(u => ({ ...u, paidAmount: 0, isPaid: false }));
        historyData.unshift({ monthName: nextMonthName, units: newUnits });

        const now = new Date().toLocaleString('ar-EG', { hour: 'numeric', minute: 'numeric', day: 'numeric', month: 'numeric' });
        if (!news) news = [];
        news.push({ text: `<b>📅 تم بدء شهر جديد: ${nextMonthName}</b>`, time: now });

        saveDataToCloud();
    }

    function updateTenant(mIndex, uIndex, val) {
        historyData[mIndex].units[uIndex].tenant = val;
        saveDataToCloud();
    }

    function updatePhone(mIndex, uIndex, val) {
        historyData[mIndex].units[uIndex].phone = val;
        saveDataToCloud();
    }

    function updatePaidAmount(mIndex, uIndex, val) {
        historyData[mIndex].units[uIndex].paidAmount = Number(val) || 0;
        saveDataToCloud();
    }

    function printMonth(mIndex) {
        window.print();
    }
</script>
</body>
</html>
